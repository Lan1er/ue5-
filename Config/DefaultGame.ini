; ---------------------------------------------------------------------------
; 常态 BGM（全程循环播放 / 跟暂停联动 / 周目结算与通关时停止）
; 以后接章节 BGM：改 BGMSoundPath，或代码里调 UMetamorphosisBGMSubsystem::PlayBGM(Sound)
; ---------------------------------------------------------------------------
[/Script/Metamorphosis.MetamorphosisBGMSubsystem]
BGMSoundPath=/Game/Audio/BGM/BGM.BGM
BGMVolume=1.0
bEnableBGM=True
bRestartAfterSettlement=True
bLogBGM=True

; ---- 打包时把非资产文件一起带上（否则 APK 里读不到配表 -> 任务/道具/剧情全部回退默认）----
; game_config.json 在 Content/Config/ 下，它不是 UAsset，必须显式声明为"总是作为 NonUFS 暂存"。
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysStageAsNonUFS=(Path="Content/Config")
; ---- 同上，但作为 UFS 打进 .pak（Android 上 NonUFS 不生效，必须走这条）----
+DirectoriesToAlwaysStageAsUFS=(Path="Content/Config")

; ---- UI/精灵/图标等大量用字符串路径加载，cook 器跟不到 -> 无条件全 cook，避免打包后白块 ----
+DirectoriesToAlwaysCook=(Path="/Game/UI")
+DirectoriesToAlwaysCook=(Path="/Game/Characters")
+DirectoriesToAlwaysCook=(Path="/Game/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/Bettle")
+DirectoriesToAlwaysCook=(Path="/Game/Audio")

; ---------------- 剧情头像映射（说话人:Portraits 下的资产名）----------------
; 没有列出的说话人会自动隐藏头像，露出美术卡片本身的插图（那张甲虫插画）。
; 2026-10-21 调整：
;   旁白      -> 风衣礼帽剪影 DLG_Card_Narrator（新素材）
;   主控/bumy -> 不映射 -> 用【美术自带的底板】（面板里那张甲虫插画，正好就是 bumy 这只虫子）
;   父亲      -> 老头形象 DLG_Card_Bumy（用户："父亲用原来的老头形象"）
;   su / 妻子 / Sam / sooy / Kim 保持原样
[/Script/Metamorphosis.MetamorphosisStoryWidget]
+PortraitMap=旁白:DLG_Card_Narrator
+PortraitMap=父亲:DLG_Card_Bumy
+PortraitMap=妻子:DLG_Card_Su
+PortraitMap=su:DLG_Card_Su
+PortraitMap=Sam:DLG_Card_Sam
+PortraitMap=sooy:DLG_Card_Sooy
+PortraitMap=Sooy:DLG_Card_Sooy
+PortraitMap=Kim:DLG_Card_Kim
