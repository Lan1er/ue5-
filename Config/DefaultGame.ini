;   触发：鼠标左键按下 / 触摸按下（UI 按钮上的点击也播）；过场 / 背包 / 暂停 / 结算期间不播。
;   同位置限频 0.12s（避免一次按下被鼠标+触摸两条链路重复播）；同时最多 6 个。
;   素材在 /Game/UI/Click/click_000 ... click_014（重新导入用 Tools/import_ui_click.py）。
; ============================================================
