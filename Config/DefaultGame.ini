; 虫形主角（2D 精灵 + 锁定视角）的可调参数——改这里不用重新编译
; 阶段1 的精灵图像世界高度（厘米）；阶段2/3 再乘数值配置表里的体积倍率（2x / 4x）
; 2026-10-09：体型整体放大一倍（8 -> 16），阶段2/3 分别是 32 / 64 cm
Stage1HeightCm=16.0

; ---------- 体型 / 移动（跟着体型一起放大） ----------
; 碰撞胶囊（厘米）
CapsuleRadiusCm=5.0
CapsuleHalfHeightCm=7.0
; 地面移动速度（厘米/秒）
WalkSpeed=60.0
; 能直接迈上去的最大台阶高度（厘米）；调大就能爬上家具
MaxStepHeightCm=5.0
; 可走坡度上限（度）：户外地形用 60，室内平地 45 就够
WalkableFloorAngleDeg=60.0
bUseFlatBaseForFloorChecks=True
; 应急开关：地图里若出现「法线朝下」的地板（角色站在地上却完全走不动），打开可临时恢复；正常应为 False
bTolerateInvertedFloors=False

; ---------- 锁定视角相机（"尽可能展示房屋"的整间房广角） ----------
; 相机到角色的距离（厘米）—— 这个值决定能看到多大范围：
;   400 ≈ 约 5m 宽 × 3m 高的范围（小半个公寓）
;   700 ≈ 一整间房 + 隔壁门口
;   35  ≈ 贴着虫子（看得清虫子，但看不到房间）
CameraDistance=450.0
; 俯角（负值 = 俯视）。房间广角一般用 -10 ~ -20：接近平视，能看到墙面和家具，
; 角度太陡（比如 -40）画面就全是地板了
CameraPitch=-15.0
; 初始水平朝向（度）；玩家可以随时绕虫子转
CameraYaw=270.0
; 水平转视角速度（度/秒）
CameraYawSpeed=120.0
; 相机 FOV（UE 里是水平 FOV）。房间广角一般 70~90，越大越广、边缘畸变也越明显
CameraFOV=80.0
; 注视点抬高：画面重心落在房间中部（墙面/家具），虫子出现在画面偏下方
; 数值是相对虫子原点的偏移（厘米）；调大 = 画面往上看更多墙，调小 = 更多地板
CameraTargetOffset=(X=0.000000,Y=0.000000,Z=90.000000)
; 相机碰撞检测：关掉 → 镜头可以待在房间外用广角"看进去"（墙面单面材质，背面被剔除）；
; 打开 → 贴墙时镜头自动收近，但就看不成整间房了
bCameraCollisionTest=False

; ---------- 近墙剖切（解决"镜头卡进墙体 / 被墙挡住"） ----------
; 每帧判断"相机 -> 注视点"这条线段有没有穿过构件，穿过的就临时不渲染（近墙剖切）。
; 只关渲染，碰撞与射线一概不动 —— 墙不画出来，但仍然挡人。
; 规则：在相机位置放一个球做重叠检测，重叠到谁就临时不渲染谁，离开后延迟恢复（2026-10-10 收紧）。
; 只关渲染，碰撞与射线一概不动 —— 物体不画出来，但仍然挡人。
; （旧规则"相机到注视点这条线段穿过谁就藏谁"会让角色贴近的物体也被删掉，已废弃）
bHideCameraBlockers=True
; 判定时把构件包围盒外扩这么多厘米（留余量，镜头真贴上去之前就先剖掉）
; 镜头"重合半径"（厘米）：相机位置这个球重叠到的构件会被临时隐藏；0 = 完全不做
CameraClearanceRadius=30.0
; 是否隐藏"挡在镜头和角色之间、把角色挡住"的构件（默认开）。
; 判定：按**角色自身可视尺寸**取一圈采样点（中心 + 环），每条从相机打一条精确射线，
; 被挡到 >= OccluderBlockedSampleThreshold 条就把该构件隐藏（默认 1 = 遮住身体一部分也算挡）。
; 演进史（两个相反的 bug，别改回去）：
;  2026-10-14：用"精灵四边形外包尺寸"取中心+上沿+左右 4 点、任一条命中就隐藏 -> 四边形含画布透明边距
;              （半宽14cm vs 胶囊半径5cm），虫子贴家具时采样点插进家具 -> "没挡镜头却被隐藏"。
;  2026-10-16：改成"只认轮廓中心一条线"后矫枉过正 -> 中心线从门缝/边缘溜过去、身体被挡住时不隐藏
;              （用户报"该隐藏没隐藏"）；且判定尺寸固定，阶段3 体型 4 倍时更盖不住。
bHideCharacterBlockers=True
; 判定半径 = 角色可视高度(GetSpriteHeightCm，**随躁郁值体型阶段放大**：阶段1 16cm -> 阶段3 64cm) × 本系数。
; 默认 0.32：阶段1 ≈ 5.1cm（正好贴近胶囊半径 5cm）、阶段3 ≈ 20.5cm。
CharacterSilhouetteRadiusScale=0.32
; 采样环的半径比例（0.8 = 环上采样点落在判定半径的 80% 处）。刻意 < 1：
; 紧贴身体的家具（距离约等于角色半径）不会被误判成遮挡，而"切进身体"的墙仍会被环上的点打到。
CharacterSilhouetteSpread=0.8
; 环上采样点数量（不含中心点）。越多越不容易漏，也越费性能。
SilhouetteRingSamples=8
; 至少被挡住几条采样线才隐藏该构件（默认 1 = 遮住一部分身体就藏；调大更保守，例如 3）
OccluderBlockedSampleThreshold=1
; 进入迟滞：开始遮挡后要连续挡这么多秒才真的隐藏（防止被"挤出/推回"的单帧命中让家具一闪而没）
OccluderHideDelay=0.12
; 退出迟滞：不再遮挡后延迟多少秒恢复渲染（防止在边界上闪烁）
OccluderRestoreDelay=0.25
; ---------------------------------------------------------------
; 相机"被空心物体包住"（2026-10-16 用户报：相机钻进大管子内部，画面被管壁糊住却没被剖开）
; 为什么需要：规则2 的射线从**相机自身**出发，相机在几何体内部时"起点即穿透"拿不到命中；
; 规则1 的球（30cm）可能小于管内径也碰不到管壁 -> 两条规则一起失效。
; 修法：①相机处小半径球直接碰管壁 ②相机周围 14 个方向打短距射线，被挡方向比例够高就判"被包住"，
;       把这些近距命中物隐藏。短距离 + 高比例是为了不把"相机站在房间/走廊里"误判。
; 相机"是否在几何体内"的小球探测半径（厘米）；0 = 关掉
CameraInsideProbeRadius=3.0
; 相机"被包住"探测距离（厘米）；0 = 关掉
CameraEnclosedProbeDistance=120.0
; 被挡方向比例阈值（6 轴 + 8 对角 = 14 条；0.75 = 至少 11/14 个方向被挡才算被包住）
CameraEnclosedBlockedRatio=0.75
; ---------------------------------------------------------------
; 排除角色/道具不被剖切（产品已拍板：不要剖角色和道具）
; 只剖 Static Mobility 的构件（默认 True）：妻子等角色运行时是 Movable，天然被排除；
; 床/墙/地板这类 Static 建筑构件照旧会被剖。
bOnlyCutStaticGeometry=True
; 带这些标签的 Actor 一律不参与剖切（逗号分隔）。默认排除妻子替身 Meta.Wife 与可交互道具 Meta.Item:*
CutawayExcludeTags=Meta.Wife,Meta.Item
; ---------------------------------------------------------------
; 包围盒兜底（2026-10-16 用户现场定位出的根因）：相机埋在一件**没有碰撞**的空心物体里时，
; 规则1（30cm 球 overlap）、规则1b（3cm 球 + 14 方向短射线）、规则2（相机->角色射线）
; **全都感知不到它**（射线/overlap 都要求碰撞），于是画面被它的内壁糊住、而"隐藏清单=0"。
; 用户现场数据正是这个特征：隐藏清单 0 个 / 被挡方向 0/14 / 相机在几何体内 0。
; Bounds 是**渲染**数据（无碰撞也有），所以补一条纯几何判定：相机点落在某构件包围盒内就藏它。
bHideCameraBoundsBlockers=True
; 包围盒规则的尺寸上限（厘米，三轴最大边长；0 = 不限）。天空球/远景壳这类巨型网格会把相机
; 永远包在里面，不加限制就会一直藏它们（天变黑）—— 只藏"管子/道具/家具"这个量级的包体。
CameraBoundsMaxSizeCm=2000.0
; 尺寸下限（厘米）：相机蹭过的小道具不值得藏
CameraBoundsMinSizeCm=40.0
; 判定外扩量（厘米）：0 = 必须真的落在包围盒内
CameraBoundsInflateCm=0.0
; 候选清单刷新间隔（秒）：遍历全世界构件太贵，缓存一份"可见构件"清单定时重建，每帧只做 AABB 判定
CameraBoundsCacheSeconds=1.0
; 是否要求"角色不在同一个包围盒里"（默认 True = 防误判的关键闸门，2026-10-16 实测定的）：
;  用户报的管子（StaticMeshActor_39，646×328×705cm）：相机在里面、角色不在 -> 照常隐藏
;  地板薄板（SM_Plank_set_B）、巨大建筑壳：相机与角色都在里面 -> 不藏（否则地面/整间房会被藏掉）
; 代价：相机与角色都钻进同一空心物体内部时不再兜底（少见情况）
bCameraBoundsRequirePlayerOutside=True
; 只剖切带这个组件标签的构件；留空 = 挡住视线的都剖。
; 如果某面墙和地板是同一个合并模型（剖了会连地板一起消失），给该剖的构件打上组件标签再填这里
BlockerComponentTag=

; ---------- 升空（没有模式开关：空格上升、X 下降、双击空格落地） ----------
; 空中移动速度（厘米/秒），水平与升降共用
FlySpeed=80.0
; 双击空格落地时额外往下压的速度
LandDownSpeed=200.0

bFaceCamera=True
bFlipByMovement=True

